#
# Tagging v* builds the release archives and attaches them, with the checksum
# manifest, to a GitHub Release. The plugin itself is never archived: a Qt
# plugin binary must match the host Qt build, so it is built locally instead.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build and verify the archives
        run: make package

      - name: Publish the release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
