#
# Runs the same checks the pre-commit hook runs, so the artwork cannot regress on a
# clone where the hook was never installed. check-dpr2 additionally renders at 2x
# and check-style renders the whole field family offscreen through the plugin.
name: theme checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt6 (qsvg), libxml2 and Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev libgl1-mesa-dev libxml2-utils cmake pkg-config \
            extra-cmake-modules g++ libqt6svg6
          pip install --disable-pip-version-check numpy pillow

      - name: Check the artwork at 1x
        run: make check

      - name: Check the artwork at 2x
        run: make check-dpr2

      - name: Build and verify distribution packages
        run: |
          make package
          ./tools/packaging/build-packages.py --check

  # The packages target Fedora/Plasma, but the fast job above is Ubuntu-only.
  # This job runs the same suite on the distribution the theme ships for,
  # including the kpackagetool6 install check that Ubuntu cannot provide.
  fedora:
    runs-on: ubuntu-24.04
    container:
      image: registry.fedoraproject.org/fedora:45
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6, kpackage and Python deps
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            make cmake gcc-c++ pkgconf-pkg-config qt6-qtbase-devel qt6-qtsvg \
            libxml2 python3-numpy python3-pillow kf6-kpackage plasma-workspace-libs \
            plasma-breeze-qt6

      - name: Check the theme on the target distribution
        # Breeze is installed here, so run the assertions the Ubuntu job skips.
        env:
          GITHUB_ACTIONS: ""
        run: make check
