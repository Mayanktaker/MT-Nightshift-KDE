  GENERATED FILE — edit tools/decoration-probe/build-decoration.py instead.
  Regenerate with: tools/decoration-probe/build-decoration.py
  Verify with:     tools/decoration-probe/check-decoration.py

  Sculpted carbon frame: 10px corners, 1px frame edge at the variant's
  explicit #32363E (chosen at blend(Header, foreground,
  0.06) or one step stronger), opaque Header/Window fills, and a
  0.26 peak cast shadow filling the 32px ring.
  Slice sizes: left/right 42px, top 71px, bottom 42px, centre 64x64.
  The 10px radius lives in the corner tiles; corner ids must be FrameSvg's names
  (topleft, topright, bottomleft, bottomright) because FrameSvgHelpers::
  borderToElementId() looks them up.
  The cast shadow is gradient based: linear ramps on the edges and a radial ramp
  around each corner, so it wraps the silhouette instead of stopping at the
  corner tangent points.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="148" height="177" viewBox="0 0 148 177" version="1.1">
  <title>MT One Dark Pro window decoration</title>
  <desc>Active, inactive and maximized Aurorae decoration slices; 10px corners; 32px shadow padding.</desc>

